name: .NET API

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API
        run: dotnet restore SwipeHire.Api/SwipeHire.Api/SwipeHire.Api.csproj

      - name: Build API
        run: dotnet build SwipeHire.Api/SwipeHire.Api/SwipeHire.Api.csproj --no-restore --configuration Release

      - name: Test API
        run: dotnet test SwipeHire.Api/SwipeHire.Api/SwipeHire.Api.csproj --no-build --configuration Release
