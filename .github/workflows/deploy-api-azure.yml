name: Deploy SwipeHire API to Azure

on:
  push:
    branches:
      - Features
    paths:
      - 'SwipeHire.Api/**'
      - 'NuGet.Config'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'local.defaults.properties'
      - '.github/workflows/deploy-api-azure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swipehire-api-production
  cancel-in-progress: false

jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android unit tests and build
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

  deploy:
    needs: android-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API dependencies
        run: dotnet restore SwipeHire.Api/SwipeHire.Api/SwipeHire.Api.csproj --configfile NuGet.Config

      - name: Publish API
        run: dotnet publish SwipeHire.Api/SwipeHire.Api/SwipeHire.Api.csproj --configuration Release --no-restore --output "${{ github.workspace }}/api-publish"

      - name: Check Azure publish profile secret
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]; then
            echo '::error::Add the AZURE_WEBAPP_PUBLISH_PROFILE repository secret before deploying.'
            exit 1
          fi

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: swipehire-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/api-publish
